on:
  push:
    tags:
      - '*'
name: Handle Release
jobs:
  generate-installer:
    name: Create release-artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create zip file for manual installation
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=GridfinityGenerator/ \
            --output="dist/GridfinityGenerator-${GITHUB_REF_NAME}.zip" HEAD -- \
            GridfinityGenerator.manifest GridfinityGenerator.py api.py config.py LICENSE.md \
            lib commands documentation/PRIVACY_POLICY.md
      - name: Upload the artifacts
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/*
          file_glob: true
          tag: ${{ github.ref }}
          body: TBD
          prerelease: true
