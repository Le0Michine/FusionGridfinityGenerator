<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    :root {
        --text: #4a4a4a;
        --muted: #8a8a8a;
        --area: #9a9a9a;
        --error: #d0021b;
        --piece: #4e79a7;
        --floor: #3d6690;
        --hole: #2a4766;
        --label-background: #1f344d;
        --piece-outline: #1f344d;
        --padding: #9db8d6;
        --padding-hatch: #4e79a7;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --text: #d6d6d6;
            --muted: #9a9a9a;
            --area: #7a7a7a;
            --error: #ff6b6b;
            --piece: #5b8cc0;
            --floor: #46729f;
            --hole: #2c4a6a;
            --label-background: #1b2d42;
            --piece-outline: #a9c6e8;
            --padding: #34587d;
            --padding-hatch: #5b8cc0;
        }
    }
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        /* the dialog's font, loaded from the Fusion install once the dialog sends it */
        font: 13px "Fusion Artifakt Element", "Artifakt Element", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
        color: var(--text);
    }
    #drawing svg {
        display: block;
        margin: 0 auto;
        /* the panel can show less than the page reports, the drawing then shrinks to it, keeping its shape */
        max-width: 100%;
        height: auto;
    }
    .area {
        fill: none;
        stroke: var(--area);
        stroke-dasharray: 3 2;
    }
    .piece {
        fill: var(--piece);
    }
    .floor {
        fill: var(--floor);
    }
    .countersink {
        fill: var(--hole);
    }
    .magnet {
        fill: none;
        stroke: #ffffff;
        stroke-opacity: 0.7;
        stroke-dasharray: 2 1.5;
        vector-effect: non-scaling-stroke;
    }
    .label {
        fill: #ffffff;
        text-anchor: middle;
        dominant-baseline: central;
    }
    /* behind the label, so it reads over the sockets */
    /* around every piece, so the seams stand out from the walls between sockets */
    .piece-outline {
        fill: none;
        stroke: var(--piece-outline);
        stroke-width: 1.5px;
    }
    .label-background {
        fill: var(--label-background);
    }
    /* solid plate past the sockets, hatched so it reads apart from the walls between them */
    .padding {
        fill: var(--padding);
    }
    .padding-hatch {
        stroke: var(--padding-hatch);
        stroke-width: 1px;
    }
    .label, .label-background {
        pointer-events: none;
    }
    #caption {
        margin-top: 6px;
        text-align: center;
        line-height: 1.5;
    }
    #caption .muted {
        color: var(--muted);
    }
    .error {
        color: var(--error);
        text-align: center;
        padding-top: 8px;
    }
</style>
</head>
<body>
<div id="drawing"></div>
<div id="caption"></div>
<script>
    // spare room below the caption, so its last line isn't cut off by rounding
    const CAPTION_SPACING = 4;
    // pieces are drawn a bit apart, the real seam gap is too thin to see at this scale
    const SEAM_INSET = 1.5;
    const LABEL_PADDING_X = 4;
    const LABEL_PADDING_Y = 1;
    // a thinner strip is left by rounding, not padding
    const MIN_PADDING = 0.1;
    // room a padding label needs along its strip, past its background
    const PADDING_LABEL_MARGIN = 3;
    // padding thinner than this at the drawing scale would be a sliver, it's drawn this thick, in from the plate edge
    const MIN_PADDING_THICKNESS = 8;
    const SVG_NS = 'http://www.w3.org/2000/svg';

    function svgElement(name, attributes) {
        const element = document.createElementNS(SVG_NS, name);
        for (const [key, value] of Object.entries(attributes)) {
            element.setAttribute(key, value);
        }
        return element;
    }

    // a socket seen from above, drawn in mm from its cell corner with Y up
    function drawSocket(cell, socket, scale, height, group, mask) {
        const transform = `translate(${cell.x * scale} ${height - cell.y * scale}) scale(${scale} ${-scale})`;
        const visible = svgElement('g', { transform: transform });
        const cuts = svgElement('g', { transform: transform });
        const inset = socket.inset || 0;
        const opening = () => svgElement('rect', {
            x: inset, y: inset, width: Math.max(cell.width - inset * 2, 0), height: Math.max(cell.length - inset * 2, 0), rx: socket.radius || 0,
        });
        const corners = [
            '',
            `translate(${cell.width} 0) scale(-1 1)`,
            `translate(0 ${cell.length}) scale(1 -1)`,
            `translate(${cell.width} ${cell.length}) scale(-1 -1)`,
        ];
        const holeOffset = socket.holeOffset || 0;
        if (socket.type === 'light') {
            const cut = opening();
            cut.setAttribute('fill', '#000000');
            cuts.appendChild(cut);
        } else {
            const floor = opening();
            floor.setAttribute('class', 'floor');
            visible.appendChild(floor);
            if (socket.type === 'skeletonized' && cell.holes && socket.padRadius) {
                // the cutout is the floor less a rounded pad around the holes in every corner
                const cut = opening();
                cut.setAttribute('fill', '#000000');
                cuts.appendChild(cut);
                const reach = holeOffset + socket.padRadius;
                for (const corner of corners) {
                    cuts.appendChild(svgElement('path', {
                        d: `M${inset},${inset} L${reach},${inset} L${reach},${holeOffset} A${socket.padRadius},${socket.padRadius} 0 0 1 ${holeOffset},${reach} L${inset},${reach} Z`,
                        transform: corner,
                        fill: '#ffffff',
                    }));
                }
            }
            if (cell.holes) {
                for (const corner of corners) {
                    if (socket.screwHeadRadius) {
                        visible.appendChild(svgElement('circle', { class: 'countersink', cx: holeOffset, cy: holeOffset, r: socket.screwHeadRadius, transform: corner }));
                    }
                    if (socket.screwRadius) {
                        cuts.appendChild(svgElement('circle', { cx: holeOffset, cy: holeOffset, r: socket.screwRadius, transform: corner, fill: '#000000' }));
                    }
                    // magnets go in from below, shown as hidden edges
                    if (socket.magnetRadius) {
                        visible.appendChild(svgElement('circle', { class: 'magnet', cx: holeOffset, cy: holeOffset, r: socket.magnetRadius, transform: corner }));
                    }
                }
            }
        }
        group.appendChild(visible);
        mask.appendChild(cuts);
    }

    // the strips of solid plate between the piece edges and its sockets, in mm like the pieces. Cells start
    // the clearance before a plate without padding does, so a strip is the padding less the clearance
    function paddingStrips(piece, xyClearance) {
        const cells = piece.cells || [];
        if (cells.length === 0) {
            return [];
        }
        const cellsMinX = Math.min(...cells.map((cell) => cell.x));
        const cellsMinY = Math.min(...cells.map((cell) => cell.y));
        const cellsMaxX = Math.max(...cells.map((cell) => cell.x + cell.width));
        const cellsMaxY = Math.max(...cells.map((cell) => cell.y + cell.length));
        const pieceMaxX = piece.x + piece.width;
        const pieceMaxY = piece.y + piece.length;
        // sides take the full piece length, the front and back fit between them
        const strips = [
            { side: 'left', x: piece.x, y: piece.y, width: cellsMinX - piece.x, length: piece.length },
            { side: 'right', x: cellsMaxX, y: piece.y, width: pieceMaxX - cellsMaxX, length: piece.length },
            { side: 'front', x: cellsMinX, y: piece.y, width: cellsMaxX - cellsMinX, length: cellsMinY - piece.y },
            { side: 'back', x: cellsMinX, y: cellsMaxY, width: cellsMaxX - cellsMinX, length: pieceMaxY - cellsMaxY },
        ];
        return strips
            .map((strip) => {
                const gap = strip.side === 'left' || strip.side === 'right' ? strip.width : strip.length;
                return { ...strip, gap: gap, size: gap + xyClearance };
            })
            .filter((strip) => strip.gap > MIN_PADDING);
    }

    // white text on a dark rounded background, so it reads over sockets and hatching alike
    function drawLabel(text, x, y, svg) {
        const group = svgElement('g', {});
        svg.appendChild(group);
        const label = svgElement('text', { class: 'label', x: x, y: y });
        label.textContent = text;
        group.appendChild(label);
        // sized after the text is laid out
        const bounds = label.getBBox();
        group.insertBefore(svgElement('rect', {
            class: 'label-background',
            x: bounds.x - LABEL_PADDING_X,
            y: bounds.y - LABEL_PADDING_Y,
            width: bounds.width + LABEL_PADDING_X * 2,
            height: bounds.height + LABEL_PADDING_Y * 2,
            rx: 3,
        }), label);
        return { group: group, width: bounds.width + LABEL_PADDING_X * 2, height: bounds.height + LABEL_PADDING_Y * 2 };
    }

    function drawPadding(piece, xyClearance, scale, width, height, group, svg) {
        for (const strip of paddingStrips(piece, xyClearance)) {
            let x = strip.x * scale;
            let y = height - (strip.y + strip.length) * scale;
            let stripWidth = strip.width * scale;
            let stripHeight = strip.length * scale;
            // the plate edge stays, a thin strip grows in over the sockets
            if (strip.side === 'left' || strip.side === 'right') {
                const thickness = Math.max(stripWidth, MIN_PADDING_THICKNESS);
                x = strip.side === 'left' ? x : x + stripWidth - thickness;
                stripWidth = thickness;
            } else {
                const thickness = Math.max(stripHeight, MIN_PADDING_THICKNESS);
                // y points down in the drawing, the front is at the bottom
                y = strip.side === 'back' ? y : y + stripHeight - thickness;
                stripHeight = thickness;
            }
            const rect = svgElement('rect', { class: 'padding', x: x, y: y, width: stripWidth, height: stripHeight });
            const title = svgElement('title', {});
            title.textContent = `padding ${strip.side} ${strip.size.toFixed(1)} mm`;
            rect.appendChild(title);
            group.appendChild(rect);
            group.appendChild(svgElement('rect', { x: x, y: y, width: stripWidth, height: stripHeight, fill: 'url(#padding-hatch)', 'pointer-events': 'none' }));

            // the value goes along the middle of the strip where it fits along it, turned on the sides,
            // its background lets it reach past a thin strip over the sockets
            const isSide = strip.side === 'left' || strip.side === 'right';
            let [centerX, centerY] = [x + stripWidth / 2, y + stripHeight / 2];
            const label = drawLabel(`${strip.size.toFixed(1)} mm`, centerX, centerY, svg);
            if (label.width + PADDING_LABEL_MARGIN * 2 > (isSide ? stripHeight : stripWidth)) {
                label.group.remove();
                continue;
            }
            // a label reaching past the drawing edge is moved in across the strip
            const clamp = (value, size, limit) => Math.min(Math.max(value, size / 2), limit - size / 2);
            if (isSide) {
                centerX = clamp(centerX, label.height, width);
            } else {
                centerY = clamp(centerY, label.height, height);
            }
            label.group.setAttribute('transform', isSide
                ? `translate(${centerX - (x + stripWidth / 2)} 0) rotate(-90 ${x + stripWidth / 2} ${centerY})`
                : `translate(0 ${centerY - (y + stripHeight / 2)})`);
        }
    }

    function render(data) {
        const drawing = document.getElementById('drawing');
        const caption = document.getElementById('caption');
        drawing.replaceChildren();
        caption.replaceChildren();
        if (data.error) {
            const error = document.createElement('div');
            error.className = 'error';
            error.textContent = data.error;
            caption.appendChild(error);
            return;
        }

        // the caption goes first, the drawing takes the height it leaves, long lines may wrap
        data.caption.forEach((line, index) => {
            const row = document.createElement('div');
            if (index > 0) {
                row.className = 'muted';
            }
            row.textContent = line;
            caption.appendChild(row);
        });
        const captionStyle = window.getComputedStyle(caption);
        const captionHeight = caption.offsetHeight + parseFloat(captionStyle.marginTop) + CAPTION_SPACING;

        // data is in mm with Y pointing up, the drawing is scaled to fit and flipped
        const [areaWidth, areaLength] = data.area;
        const maxWidth = Math.max(document.documentElement.clientWidth - 4, 40);
        // the svg is a pixel larger on every side than the drawing, for the outline stroke
        const maxHeight = Math.max(document.documentElement.clientHeight - captionHeight - 2, 40);
        const scale = Math.min(maxWidth / areaWidth, maxHeight / areaLength);
        const width = areaWidth * scale;
        const height = areaLength * scale;
        const svg = svgElement('svg', { width: width + 2, height: height + 2, viewBox: `-1 -1 ${width + 2} ${height + 2}` });
        // in the page from the start, labels measure their text
        drawing.appendChild(svg);
        const defs = svgElement('defs', {});
        const hatch = svgElement('pattern', { id: 'padding-hatch', patternUnits: 'userSpaceOnUse', width: 6, height: 6, patternTransform: 'rotate(45)' });
        hatch.appendChild(svgElement('line', { class: 'padding-hatch', x1: 0, y1: 0, x2: 0, y2: 6 }));
        defs.appendChild(hatch);
        svg.appendChild(defs);
        // grid units plates have no area around them, the plate fills the drawing
        if (data.showArea !== false) {
            svg.appendChild(svgElement('rect', { class: 'area', x: 0, y: 0, width: width, height: height }));
        }

        const socket = data.socket || {};
        data.pieces.forEach((piece, pieceIndex) => {
            // a single plate has no seams, an inset would only eat into its thin outer walls
            const inset = data.pieces.length > 1 ? SEAM_INSET : 0;
            const x = piece.x * scale + inset;
            const y = height - (piece.y + piece.length) * scale + inset;
            const pieceWidth = Math.max(piece.width * scale - inset * 2, 1);
            const pieceHeight = Math.max(piece.length * scale - inset * 2, 1);
            // through cuts are black in the mask, so the page shows through them
            const maskId = `piece-mask-${pieceIndex}`;
            const mask = svgElement('mask', { id: maskId, maskUnits: 'userSpaceOnUse' });
            mask.appendChild(svgElement('rect', { x: x, y: y, width: pieceWidth, height: pieceHeight, rx: 2, fill: '#ffffff' }));
            const group = svgElement('g', { mask: `url(#${maskId})` });
            const rect = svgElement('rect', { class: 'piece', x: x, y: y, width: pieceWidth, height: pieceHeight, rx: 2 });
            const title = svgElement('title', {});
            title.textContent = `${piece.label} u, ${piece.width.toFixed(1)} x ${piece.length.toFixed(1)} mm`;
            rect.appendChild(title);
            group.appendChild(rect);
            for (const cell of piece.cells || []) {
                drawSocket(cell, socket, scale, height, group, mask);
            }
            svg.appendChild(mask);
            svg.appendChild(group);
            // over the sockets, kept to the piece outline but not cut by the socket openings, as a thin strip
            // drawn thicker reaches over them, the labels go above everything drawn so far
            const clipId = `piece-clip-${pieceIndex}`;
            const clip = svgElement('clipPath', { id: clipId });
            clip.appendChild(svgElement('rect', { x: x, y: y, width: pieceWidth, height: pieceHeight, rx: 2 }));
            svg.appendChild(clip);
            const paddingGroup = svgElement('g', { 'clip-path': `url(#${clipId})` });
            svg.appendChild(paddingGroup);
            drawPadding(piece, data.xyClearance || 0, scale, width, height, paddingGroup, svg);
            // a single plate's edge needs no outline, the pieces of a fill do
            if (data.pieces.length > 1) {
                svg.appendChild(svgElement('rect', { class: 'piece-outline', x: x, y: y, width: pieceWidth, height: pieceHeight, rx: 2 }));
            }
            if (pieceWidth >= 34 && pieceHeight >= 18) {
                drawLabel(piece.label, x + pieceWidth / 2, y + pieceHeight / 2, svg);
            }
        });

    }

    let lastData = null;
    // the dialog's font comes from the Fusion install, its path changes with every update
    let loadedFont = '';
    function loadFont(fontUrl) {
        if (!fontUrl || fontUrl === loadedFont) {
            return;
        }
        loadedFont = fontUrl;
        const style = document.createElement('style');
        style.textContent = `@font-face { font-family: "Fusion Artifakt Element"; src: url("${fontUrl}"); }`;
        document.head.appendChild(style);
        // labels are sized from the laid out text, so they're drawn again with the font
        document.fonts.ready.then(() => {
            if (lastData) {
                render(lastData);
            }
        });
    }

    function update(json) {
        if (!json) {
            return;
        }
        lastData = JSON.parse(json);
        loadFont(lastData.fontUrl);
        render(lastData);
    }

    window.addEventListener('resize', () => {
        if (lastData) {
            render(lastData);
        }
    });

    window.fusionJavaScriptHandler = {
        handle: function (action, data) {
            if (action === 'update') {
                update(data);
            }
            return 'OK';
        },
    };

    // the bridge is injected after the page starts loading, older Fusion versions return the data directly
    function requestInitialData() {
        if (!window.adsk || !adsk.fusionSendData) {
            setTimeout(requestInitialData, 100);
            return;
        }
        const result = adsk.fusionSendData('ready', '');
        if (result && typeof result.then === 'function') {
            result.then(update);
        } else {
            update(result);
        }
    }
    requestInitialData();
</script>
</body>
</html>
