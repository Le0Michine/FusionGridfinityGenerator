<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="dialog.css">
<style>
    :root {
        --text: #3c3c3c;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --text: #e2e2e2;
        }
    }
    html, body {
        height: 100%;
    }
    body {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 0 4px;
    }
    button {
        flex: 0 1 auto;
        min-width: 0;
        height: 26px;
        padding: 0 6px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
</style>
</head>
<body>
    <button data-action="save" title="Save the current inputs as new defaults for this dialog">Save as defaults</button>
    <button data-action="reset" title="Set the inputs back to the saved defaults">Reset to defaults</button>
    <button data-action="factoryReset" title="Wipe the saved defaults and set the inputs back to the original ones">Clear defaults</button>
<script src="fusionBridge.js"></script>
<script>
    for (const button of document.querySelectorAll('button')) {
        button.addEventListener('click', () => fusionBridge.send('defaults', button.dataset.action));
    }
    // the row only takes the font
    fusionBridge.connect(() => {});
</script>
</body>
</html>
